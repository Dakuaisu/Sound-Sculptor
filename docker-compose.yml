version: "3.9"

services:
  app:
    build: .
    ports:
      - "80:80"
    env_file:
      - .env
    environment:
      - FRONTEND_URL=http://127.0.0.1
      - SPOTIFY_REDIRECT_URI=http://127.0.0.1/api/callback
      - FLASK_ENV=production
    restart: unless-stopped
    volumes:
      # Built by scripts/build_index.py
      - ./server/knn_index.pkl:/app/server/knn_index.pkl:ro

